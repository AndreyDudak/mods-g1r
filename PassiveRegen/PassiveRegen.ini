; ============================================================
;  PassiveRegen - configuration
;  Change values and press Ctrl+R in game (hot reload) -> applied immediately.
;  true/false for switches, numbers for values. Lines starting with ; are comments.
; ============================================================

; ---------- HP regeneration ----------
; HP regen on/off.
HpRegenEnabled=true
; HP only regenerates if STRENGTH >= this value. 0 = no requirement.
MinStrengthForHp=0
; Regenerate HP during combat / aggro too? false = only outside combat.
RegenHpInCombat=true

; ---------- MP regeneration ----------
; MP regen on/off.
MpRegenEnabled=true
; MP only regenerates if MAX MANA (magic capacity) >= this value. 0 = no requirement.
MinMaxManaForMp=0
; Regenerate MP during combat / aggro too? false = only outside combat.
RegenMpInCombat=true
; When mana hits 0 the game blocks casting even after mana refills (a hidden gate). This clears
; it automatically (mimics drinking a mana potion). Set false to disable.
ClearOutOfManaGate=true

; ---------- Tuning (optional) ----------
; How much is restored each time a resource regenerates (percent of its maximum; 0.01 = 1%).
HpPercentPerTick=0.01
MpPercentPerTick=0.05
; Base update interval in seconds (how often the mod checks; also the smallest possible step).
TickIntervalSeconds=1
; How often HP / MP actually regenerate, in seconds. HP and MP can use different clocks
; (rounded to multiples of TickIntervalSeconds). Leave equal to TickIntervalSeconds for the
; classic behaviour. Example: HpIntervalSeconds=2, MpIntervalSeconds=10 -> MP regens slower.
HpIntervalSeconds=1
MpIntervalSeconds=1
; Cooldown after combat/aggro before regen resumes (seconds).
CombatCooldownSeconds=10
; Block regen while a nearby enemy is aggressive (e.g. an enemy chasing you after a fight).
; This needs a periodic enemy scan during the post-combat window. Set false for maximum
; performance (regen then only pauses for your own combat actions + the cooldown).
AggroBlocksRegen=false
; Range within which an aggressive enemy blocks regen (UE units / cm; 1 unit = 1 cm, so 4000 = 40 m).
; 0 = any aggressive enemy blocks.
AggroRangeUnits=4000

; ---------- Controls ----------
; Key that toggles the mod on/off (in case another mod uses the same key).
; Examples: F8, F7, F6, NUM_ZERO ... NUM_NINE, A ... Z. Set to NONE to disable the toggle.
ToggleKey=F8
